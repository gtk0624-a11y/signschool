<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>회의 등록부 관리자</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#e8956d;--pl:#f2b899;--pd:#c9714a;--bg:#fdf6f0;--bg2:#faeee4;--w:#fff;--t:#4a3020;--tm:#9a7860;--b:#edd8c8;--ok:#6bbf7a;--err:#d4736a;--sh:0 4px 20px rgba(180,100,60,.10);--shl:0 8px 36px rgba(180,100,60,.16);--r:16px;--rs:10px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--t);min-height:100vh;padding-bottom:80px}
.hdr{background:linear-gradient(135deg,#c9714a,#e8956d 55%,#f2b899);color:#fff;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 16px rgba(180,100,60,.28)}
.hdr-logo{display:flex;align-items:center;gap:10px}
.hdr-icon{width:36px;height:36px;background:rgba(255,255,255,.25);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:19px}
.hdr-title{font-family:'Noto Serif KR',serif;font-size:14px;font-weight:700;line-height:1.25}
.hdr-sub{font-size:11px;color:rgba(255,255,255,.7);font-weight:300}
.tabs{background:#fff;border-bottom:1.5px solid var(--b);display:flex;overflow-x:auto;padding:0 6px;scrollbar-width:none;position:sticky;top:62px;z-index:100}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 14px;border:none;background:none;color:var(--tm);font-size:13px;font-weight:500;font-family:'Noto Sans KR',sans-serif;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;transition:all .2s}
.tab.on{color:var(--pd);border-bottom-color:var(--p);font-weight:700}
.view{display:none;padding:16px 14px;max-width:600px;margin:0 auto}
.view.on{display:block}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:17px;margin-bottom:13px;border:1px solid rgba(237,200,170,.5)}
.card-title{font-size:11px;font-weight:700;color:var(--tm);text-transform:uppercase;letter-spacing:.06em;margin-bottom:13px}
.fg{margin-bottom:13px}
.fl{display:block;font-size:13px;font-weight:600;color:var(--t);margin-bottom:5px}
.fi,.fs{width:100%;padding:10px 12px;border:1.5px solid var(--b);border-radius:var(--rs);font-size:14px;font-family:'Noto Sans KR',sans-serif;color:var(--t);background:var(--bg);transition:border-color .2s;appearance:none}
.fi:focus,.fs:focus{outline:none;border-color:var(--p);background:#fff}
.sw{position:relative}
.sw::after{content:'▾';position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--tm);pointer-events:none}
.btn{padding:11px 16px;border-radius:var(--rs);font-size:14px;font-family:'Noto Sans KR',sans-serif;font-weight:600;cursor:pointer;border:none;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.btn-p{background:var(--p);color:#fff;width:100%}
.btn-p:hover{background:var(--pd)}
.btn-o{background:transparent;border:1.5px solid var(--b);color:var(--tm)}
.btn-o:hover{border-color:var(--p);color:var(--pd)}
.btn-sm{padding:5px 11px;font-size:12px;width:auto}
.btn-xs{padding:3px 8px;font-size:11px;width:auto;border-radius:6px}
.btn-del{background:transparent;border:1.5px solid #f4c4c0;color:var(--err);font-size:11px;padding:3px 8px;border-radius:6px;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.pin-wrap{text-align:center;padding:36px 18px}
.pin-row{display:flex;gap:10px;justify-content:center;margin-bottom:13px}
.pin-d{width:50px;height:54px;border:2px solid var(--b);border-radius:10px;text-align:center;font-size:22px;font-weight:700;background:var(--bg);color:var(--t);font-family:'Noto Sans KR',sans-serif}
.pin-d:focus{outline:none;border-color:var(--p);background:#fff}
.mtg-grp{margin-bottom:18px;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.mtg-hdr{background:linear-gradient(135deg,#c9714a,#e8956d);color:#fff;padding:11px 15px;display:flex;justify-content:space-between;align-items:center}
.mtg-hdr-name{font-family:'Noto Serif KR',serif;font-size:14px;font-weight:700}
.mtg-hdr-meta{font-size:11px;opacity:.8;margin-top:2px}
.cnt-badge{background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.stbl{width:100%;border-collapse:collapse;font-size:13px}
.stbl th{background:var(--bg2);padding:8px 11px;text-align:left;font-weight:600;color:var(--tm);font-size:11px;border-bottom:1px solid var(--b)}
.stbl td{padding:8px 11px;border-bottom:1px solid var(--b);vertical-align:middle;background:#fff}
.stbl tr:last-child td{border-bottom:none}
.sig-img{width:80px;height:36px;object-fit:contain;background:#fff;border:1px solid var(--b);border-radius:4px}
.rtag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;background:#faeadc;color:#c9714a}
.rtag.chair{background:#fff0d8;color:#b07a20}
.rtag.boss{background:#fde8e0;color:#c05040}
.frow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:13px}
.fchip{padding:4px 12px;border-radius:20px;border:1.5px solid var(--b);background:#fff;font-size:12px;font-family:'Noto Sans KR',sans-serif;color:var(--tm);cursor:pointer}
.fchip.on{background:var(--p);border-color:var(--p);color:#fff;font-weight:600}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--t);color:#fff;padding:11px 20px;border-radius:28px;font-size:13px;font-weight:500;box-shadow:var(--shl);z-index:9999;transition:transform .35s cubic-bezier(.34,1.56,.64,1);white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--err)}
.modal{position:fixed;inset:0;background:rgba(80,40,20,.35);backdrop-filter:blur(3px);z-index:500;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.modal.open{opacity:1;pointer-events:all}
.modal-sheet{background:#fff;border-radius:20px 20px 0 0;padding:18px 16px 34px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;transform:translateY(100%);transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.modal.open .modal-sheet{transform:translateY(0)}
.modal-handle{width:38px;height:4px;background:var(--b);border-radius:2px;margin:0 auto 16px}
.modal-title{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:700;margin-bottom:15px}
.cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.cal-nav{background:none;border:none;font-size:20px;cursor:pointer;color:var(--p);padding:4px 9px;border-radius:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--tm);padding:3px 0}
.cal-day{text-align:center;font-size:13px;padding:7px 2px;border-radius:8px;cursor:pointer;transition:all .15s;color:var(--t)}
.cal-day:hover{background:var(--pl);color:#fff}
.cal-day.today{font-weight:700;color:var(--pd)}
.cal-day.sel{background:var(--p);color:#fff;font-weight:700}
.cal-day.sun{color:#d4736a}
.cal-day.sel.sun{color:#fff}
.cal-day.empty{cursor:default}
.time-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:13px}
.time-sel{padding:9px 13px;border:1.5px solid var(--b);border-radius:var(--rs);font-size:15px;font-weight:700;font-family:'Noto Sans KR',sans-serif;color:var(--t);background:var(--bg);min-width:68px;text-align:center;appearance:none;cursor:pointer}
.mi{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;background:var(--bg);border-radius:var(--rs);margin-bottom:5px;border:1px solid var(--b)}
.mi-name{font-weight:600;font-size:13px}
.mi-meta{font-size:11px;color:var(--tm);margin-top:2px}
.si{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;background:var(--bg);border-radius:var(--rs);margin-bottom:5px;border:1px solid var(--b)}
.divider{height:1px;background:var(--b);margin:11px 0}
.ir{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.ir .l{color:var(--tm)} .ir .v{font-weight:600}
.loading{text-align:center;padding:34px;color:var(--tm);font-size:13px}
.spin{width:28px;height:28px;border:3px solid var(--b);border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 9px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:34px 18px;color:var(--tm)}
.dept-hdr{background:linear-gradient(90deg,#f2b899,#fbe8d8);color:var(--t);padding:7px 13px;border-radius:var(--rs);margin-bottom:5px;font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.cfg-input{width:100%;padding:10px 12px;border:1.5px solid var(--b);border-radius:var(--rs);font-size:13px;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--t);margin-bottom:7px}
.cfg-input:focus{outline:none;border-color:var(--p)}
.footer{text-align:center;padding:18px 14px 6px;color:var(--tm);font-size:11px;line-height:1.9}
.footer strong{color:var(--pd)}
.qr-box{background:var(--bg2);border-radius:var(--r);padding:16px;text-align:center;margin-bottom:13px}
.qr-url{font-size:12px;color:var(--pd);font-weight:600;word-break:break-all;margin-top:8px}
@media print{.hdr,.tabs,.no-print,.footer{display:none!important}body{background:#fff;padding:0}.view{display:block!important;padding:0}.card{box-shadow:none;border:1px solid #ddd}}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-logo">
    <div class="hdr-icon">📋</div>
    <div>
      <div class="hdr-title" id="hdrTitle">회의 전자서명 관리자</div>
      <div class="hdr-sub" id="hdrSub">로딩 중...</div>
    </div>
  </div>
</div>

<div class="tabs no-print">
  <button class="tab on" id="tab-admin" onclick="goTab('admin')">📊 현황</button>
  <button class="tab" id="tab-members" onclick="goTab('members')">👥 명단관리</button>
  <button class="tab" id="tab-settings" onclick="goTab('settings')">⚙️ 설정</button>
</div>

<!-- 현황 -->
<div class="view on" id="view-admin">
  <div id="adminLocked">
    <div class="pin-wrap">
      <div style="font-size:42px;margin-bottom:13px;">🔐</div>
      <div style="font-size:17px;font-weight:700;margin-bottom:6px;">관리자 로그인</div>
      <p style="color:var(--tm);font-size:13px;margin-bottom:16px;">비밀번호 4자리를 입력하세요</p>
      <div class="pin-row">
        <input type="password" class="pin-d" id="p1" maxlength="1" inputmode="numeric" oninput="pm(this,'p2')">
        <input type="password" class="pin-d" id="p2" maxlength="1" inputmode="numeric" oninput="pm(this,'p3')" onkeydown="pb(event,'p1')">
        <input type="password" class="pin-d" id="p3" maxlength="1" inputmode="numeric" oninput="pm(this,'p4')" onkeydown="pb(event,'p2')">
        <input type="password" class="pin-d" id="p4" maxlength="1" inputmode="numeric" oninput="chkPin()" onkeydown="pb(event,'p3')">
      </div>
      <p id="pinErr" style="color:var(--err);font-size:12px;height:15px;"></p>
    </div>
  </div>
  <div id="adminPanel" style="display:none;">
    <div class="card no-print">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;">
        <div style="font-weight:700;font-size:15px;">서명 현황</div>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-o btn-sm no-print" onclick="window.print()">🖨️ 인쇄</button>
          <button class="btn btn-o btn-sm no-print" onclick="lockAdmin()">🔒 잠금</button>
        </div>
      </div>
      <div class="frow" id="filterRow"><button class="fchip on" onclick="flt('all',this)">전체</button></div>
    </div>
    <div id="adminContent"><div class="loading"><div class="spin"></div></div></div>
  </div>
</div>

<!-- 명단관리 -->
<div class="view" id="view-members">
  <div class="card">
    <div class="card-title">🏢 부서·학년 추가</div>
    <div style="display:flex;gap:6px;">
      <input type="text" class="fi" id="newDept" placeholder="예: 1학년부, 교무부" style="flex:1;">
      <button class="btn btn-p btn-sm" onclick="addDept()">+ 추가</button>
    </div>
  </div>
  <div id="deptList"><div class="loading"><div class="spin"></div></div></div>
  <div class="card">
    <div class="card-title">📋 회의별 참석 명단 지정</div>
    <p style="font-size:12px;color:var(--tm);margin-bottom:11px;">각 회의에 사용할 부서를 체크하세요</p>
    <div id="mtgAssign"><div class="loading"><div class="spin"></div></div></div>
  </div>
</div>

<!-- 설정 -->
<div class="view" id="view-settings">
  <div class="card">
    <div class="card-title">📱 QR 서명 링크</div>
    <div class="qr-box">
      <div style="font-size:13px;color:var(--tm);margin-bottom:6px;">아래 주소를 QR로 만들어 배포하세요</div>
      <div class="qr-url" id="signUrl"></div>
      <button class="btn btn-p" style="margin-top:12px;max-width:200px;" onclick="copyUrl()">📋 주소 복사</button>
    </div>
  </div>
  <div class="card">
    <div class="card-title">🏫 학교 기본 설정</div>
    <div class="fg"><label class="fl">학교명</label><input type="text" class="fi" id="cfgSchool" placeholder="예: 곡선중학교"></div>
    <div class="fg"><label class="fl">관리자 비밀번호 (4자리)</label><input type="password" class="fi" id="cfgPin" placeholder="현재 비밀번호 변경 시 입력" maxlength="4" inputmode="numeric"></div>
    <button class="btn btn-p" onclick="saveSchool()">저장</button>
  </div>
  <div class="card">
    <div class="card-title">📋 회의 관리</div>
    <div id="mtgSettingList"><div class="loading"><div class="spin"></div></div></div>
    <div class="divider"></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">
      <input type="text" class="fi" id="newMtgName" placeholder="회의 이름" style="flex:2;min-width:130px;">
      <div class="sw" style="flex:1;min-width:85px;"><select class="fs" id="newMtgType"><option value="교직원">교직원</option><option value="학년부">학년부</option><option value="위원회">위원회</option><option value="기타">기타</option></select></div>
    </div>
    <button class="btn btn-p" style="margin-top:7px;" onclick="addMeeting()">+ 회의 추가</button>
  </div>
  <div class="card">
    <div class="card-title">ℹ️ 앱 정보</div>
    <div class="ir"><span class="l">버전</span><span class="v">2.1.0</span></div>
    <div class="ir"><span class="l">저장소</span><span class="v">Firebase Realtime DB</span></div>
  </div>
  <div class="footer"><strong>© 2026 김정환 · M.A.D.T</strong><br>회의 전자서명 등록부 v2.1 · Made with ♥</div>
</div>

<div class="toast" id="toast"></div>

<!-- 날짜+시간 모달 -->
<div class="modal" id="sessModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">📅 날짜·시간 추가</div>
    <div class="cal-hdr"><button class="cal-nav" onclick="calNav(-1)">‹</button><div style="font-weight:700;font-size:15px;" id="calMY"></div><button class="cal-nav" onclick="calNav(1)">›</button></div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="time-row">
      <span style="font-size:13px;font-weight:600;color:var(--tm);">시간</span>
      <select class="time-sel" id="tH"></select>
      <span style="font-size:18px;font-weight:900;color:var(--tm);">:</span>
      <select class="time-sel" id="tM"></select>
    </div>
    <div id="calSel" style="text-align:center;margin-top:9px;font-weight:700;color:var(--pd);font-size:13px;min-height:18px;"></div>
    <div style="display:flex;gap:7px;margin-top:13px;">
      <button class="btn btn-o" style="flex:1;" onclick="closeSessModal()">취소</button>
      <button class="btn btn-p" style="flex:2;" onclick="confirmSess()">확인</button>
    </div>
  </div>
</div>

<!-- 멤버 모달 -->
<div class="modal" id="memModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="memModalTitle">👤 멤버 추가</div>
    <div class="fg"><label class="fl">성명 *</label><input type="text" class="fi" id="mmName" placeholder="이름 입력"></div>
    <div class="fg"><label class="fl">구분·직책</label><div class="sw"><select class="fs" id="mmRole"><option value="교사">교사</option><option value="위원장">위원장</option><option value="교장">교장</option><option value="교감">교감</option><option value="간사">간사</option><option value="교사위원">교사위원</option><option value="학부모위원">학부모위원</option><option value="지역위원">지역위원</option><option value="학교운영위원장">학교운영위원장</option><option value="위원">위원</option></select></div></div>
    <div class="fg"><label class="fl">부서·학년</label><div class="sw"><select class="fs" id="mmDept"></select></div></div>
    <div class="fg"><label class="fl">비고 (선택)</label><input type="text" class="fi" id="mmNote" placeholder="예: 담임, 부장 등"></div>
    <div style="display:flex;gap:7px;">
      <button class="btn btn-o" style="flex:1;" onclick="closeMemModal()">취소</button>
      <button class="btn btn-p" style="flex:2;" onclick="saveMem()">저장</button>
    </div>
  </div>
</div>

<script type="module">
const LS={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
window.toast=(msg,type='')=>{const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+type;setTimeout(()=>t.className='toast',2800)};

const FB_CFG={apiKey:"AIzaSyDkdB4LJQR6dg5eVnG-Q7e8-aB_bkpV7Ls",authDomain:"ckarhks.firebaseapp.com",databaseURL:"https://ckarhks-default-rtdb.firebaseio.com",projectId:"ckarhks"};

let db=null,_fb=null,adminOK=false,curFlt='all';
let calY,calM,calDate=null,sessMtgId=null,memEditId=null;

window.goTab=tab=>{
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  document.getElementById('view-'+tab).classList.add('on');
  const tb=document.getElementById('tab-'+tab);if(tb)tb.classList.add('on');
  if(tab==='admin'&&adminOK)loadAdmin();
  if(tab==='settings')loadSettingsUI();
  if(tab==='members')loadMembers();
};

async function init(){
  try{
    const {initializeApp,getApps}=await import('https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js');
    const {getDatabase,ref,push,get,set,remove,update}=await import('https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js');
    const app=getApps().length?getApps()[0]:initializeApp(FB_CFG);
    db=getDatabase(app);_fb={ref,push,get,set,remove,update};
    const school=LS.get('school_name')||'';
    document.getElementById('hdrTitle').textContent=(school||'관리자')+(school?' 전자서명 관리':'');
    document.getElementById('hdrSub').textContent=school||'학교명을 설정에서 입력하세요';
    await initDefaults();
  }catch(e){console.error(e);}
}

async function initDefaults(){
  const {ref,get,set}=_fb;const snap=await get(ref(db,'meetings'));
  if(!snap.exists())await set(ref(db,'meetings'),{
    mtg1:{name:'전체 교직원 회의',type:'교직원',order:1,sessions:{}},
    mtg2:{name:'1학년 학년부 회의',type:'학년부',order:2,sessions:{}},
    mtg3:{name:'2학년 학년부 회의',type:'학년부',order:3,sessions:{}},
    mtg4:{name:'3학년 학년부 회의',type:'학년부',order:4,sessions:{}},
    mtg5:{name:'학교운영위원회',type:'위원회',order:5,sessions:{}},
    mtg6:{name:'학업성적관리위원회',type:'위원회',order:6,sessions:{}}
  });
}

const getMtgs=async()=>{if(!db)return{};const s=await _fb.get(_fb.ref(db,'meetings'));return s.exists()?s.val():{}};
const getDepts=async()=>{if(!db)return{};const s=await _fb.get(_fb.ref(db,'depts'));return s.exists()?s.val():{}};
const getMems=async()=>{if(!db)return{};const s=await _fb.get(_fb.ref(db,'members'));return s.exists()?s.val():{}};
const getSigs=async()=>{if(!db)return{};const s=await _fb.get(_fb.ref(db,'signatures'));return s.exists()?s.val():{}};

window.pm=(el,nid)=>{if(el.value.length===1&&nid)document.getElementById(nid).focus();};
window.pb=(e,pid)=>{if(e.key==='Backspace'&&!e.target.value)document.getElementById(pid).focus();};
window.chkPin=()=>{
  const v=['p1','p2','p3','p4'].map(id=>document.getElementById(id).value).join('');
  if(v.length<4)return;
  const pin=String(LS.get('admin_pin')||'1234');
  if(v===pin){adminOK=true;document.getElementById('adminLocked').style.display='none';document.getElementById('adminPanel').style.display='block';loadAdmin();['p1','p2','p3','p4'].forEach(id=>document.getElementById(id).value='');}
  else{document.getElementById('pinErr').textContent='❌ 비밀번호가 올바르지 않습니다';['p1','p2','p3','p4'].forEach(id=>document.getElementById(id).value='');document.getElementById('p1').focus();setTimeout(()=>document.getElementById('pinErr').textContent='',2000);}
};
window.lockAdmin=()=>{adminOK=false;document.getElementById('adminLocked').style.display='block';document.getElementById('adminPanel').style.display='none';};

async function loadAdmin(){
  if(!db)return;const[sigs,mtgs]=await Promise.all([getSigs(),getMtgs()]);
  const fr=document.getElementById('filterRow');
  fr.innerHTML=`<button class="fchip ${curFlt==='all'?'on':''}" onclick="flt('all',this)">전체</button>`;
  const um={};Object.values(sigs).forEach(s=>{um[s.meetingId]=s.meetingName;});
  Object.entries(um).forEach(([id,name])=>{const c=document.createElement('button');c.className='fchip'+(curFlt===id?' on':'');c.textContent=name.length>8?name.slice(0,8)+'…':name;c.onclick=function(){flt(id,this);};fr.appendChild(c);});
  renderAdmin(sigs);
}
window.flt=(id,el)=>{curFlt=id;document.querySelectorAll('.fchip').forEach(c=>c.classList.remove('on'));el.classList.add('on');loadAdmin();};
function renderAdmin(sigs){
  const c=document.getElementById('adminContent');
  let entries=Object.entries(sigs);
  if(curFlt!=='all')entries=entries.filter(([,s])=>s.meetingId===curFlt);
  if(!entries.length){c.innerHTML='<div class="empty">📭<br>등록된 서명이 없습니다.</div>';return;}
  const grps={};entries.forEach(([id,s])=>{const k=s.meetingId+'|'+(s.sessionKey||s.dateStr||'');if(!grps[k])grps[k]={name:s.meetingName,date:s.dateStr||'',time:s.timeStr||'',sigs:[]};grps[k].sigs.push({id,...s});});
  const rc=r=>r==='위원장'||r==='학교운영위원장'?'chair':r==='교장'||r==='교감'?'boss':'';
  let html='';
  Object.entries(grps).sort((a,b)=>b[1].date.localeCompare(a[1].date)).forEach(([,g])=>{
    html+=`<div class="mtg-grp"><div class="mtg-hdr"><div><div class="mtg-hdr-name">${g.name}</div><div class="mtg-hdr-meta">${g.date} ${g.time}</div></div><span class="cnt-badge">${g.sigs.length}명</span></div><table class="stbl"><thead><tr><th style="width:26px">번</th><th>구분</th><th>성명</th><th>서명</th><th class="no-print" style="width:34px"></th></tr></thead><tbody>`;
    g.sigs.sort((a,b)=>a.timestamp-b.timestamp).forEach((s,i)=>{html+=`<tr><td style="text-align:center;color:var(--tm);font-size:11px;">${i+1}</td><td><span class="rtag ${rc(s.role)}">${s.role}</span></td><td style="font-weight:600;">${s.name}</td><td><img class="sig-img" src="${s.signature}" alt="${s.name}"></td><td class="no-print" style="text-align:center;"><button onclick="delSig('${s.id}')" style="background:none;border:none;cursor:pointer;color:var(--err);font-size:14px;">🗑</button></td></tr>`;});
    html+=`</tbody></table></div>`;
  });
  c.innerHTML=html;
}
window.delSig=async id=>{if(!confirm('이 서명을 삭제하시겠습니까?'))return;await _fb.remove(_fb.ref(db,'signatures/'+id));toast('삭제되었습니다');loadAdmin();};

async function loadMembers(){
  if(!db){toast('연결 오류','err');return;}
  await renderDepts();await renderMtgAssign();
}
async function renderDepts(){
  const depts=await getDepts();const mems=await getMems();const c=document.getElementById('deptList');
  if(!Object.keys(depts).length){c.innerHTML='<div class="card"><p style="color:var(--tm);font-size:13px;text-align:center;padding:8px 0;">부서/학년을 먼저 추가하세요.</p></div>';return;}
  let html='';
  Object.entries(depts).sort((a,b)=>(a[1].order||0)-(b[1].order||0)).forEach(([did,d])=>{
    const dm=Object.entries(mems).filter(([,m])=>m.deptId===did).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
    html+=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;"><div class="dept-hdr" style="flex:1;margin:0;">${d.name} <span style="font-size:11px;font-weight:400;opacity:.7;">(${dm.length}명)</span></div><div style="display:flex;gap:5px;margin-left:7px;"><button class="btn btn-p btn-sm" onclick="openMemModal(null,'${did}')">+ 추가</button><button class="btn-del" onclick="delDept('${did}')">삭제</button></div></div>`;
    if(dm.length)dm.forEach(([mid,mem])=>{html+=`<div class="mi"><div><div class="mi-name">${mem.name}</div><div class="mi-meta">${mem.role||''} ${mem.note?'· '+mem.note:''}</div></div><div style="display:flex;gap:5px;"><button class="btn btn-o btn-xs" onclick="openMemModal('${mid}','${mem.deptId||''}')">편집</button><button class="btn-del" onclick="delMem('${mid}')">삭제</button></div></div>`;});
    else html+='<p style="font-size:12px;color:var(--tm);text-align:center;padding:6px 0;">멤버 없음</p>';
    html+='</div>';
  });
  c.innerHTML=html;
}
async function renderMtgAssign(){
  const mtgs=await getMtgs();const depts=await getDepts();const c=document.getElementById('mtgAssign');
  if(!Object.keys(depts).length){c.innerHTML='<p style="font-size:12px;color:var(--tm);">부서를 먼저 추가하세요.</p>';return;}
  let html='';
  Object.entries(mtgs).sort((a,b)=>(a[1].order||0)-(b[1].order||0)).forEach(([mid,m])=>{
    const assigned=m.assignedDepts||[];
    html+=`<div style="margin-bottom:13px;"><div style="font-weight:700;font-size:13px;margin-bottom:6px;">${m.name}</div><div style="display:flex;flex-wrap:wrap;gap:5px;">`;
    Object.entries(depts).forEach(([did,d])=>{const ck=assigned.includes(did);html+=`<label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;background:${ck?'var(--pl)':'var(--bg)'};border:1.5px solid ${ck?'var(--p)':'var(--b)'};border-radius:20px;padding:4px 11px;transition:all .15s;"><input type="checkbox" ${ck?'checked':''} onchange="togAssign('${mid}','${did}',this.checked)" style="display:none;">${d.name}</label>`;});
    html+='</div></div>';
  });
  c.innerHTML=html;
}
window.togAssign=async(mid,did,ck)=>{const mtgs=await getMtgs();const m=mtgs[mid];let a=m.assignedDepts||[];if(ck&&!a.includes(did))a.push(did);if(!ck)a=a.filter(d=>d!==did);await _fb.update(_fb.ref(db,'meetings/'+mid),{assignedDepts:a});toast('저장되었습니다 ✓','ok');await renderMtgAssign();};
window.addDept=async()=>{const name=document.getElementById('newDept').value.trim();if(!name){toast('부서명을 입력하세요','err');return;}const d=await getDepts();const mo=Object.values(d).reduce((m,v)=>Math.max(m,v.order||0),0);await _fb.push(_fb.ref(db,'depts'),{name,order:mo+1});document.getElementById('newDept').value='';toast('추가되었습니다 ✓','ok');await renderDepts();await renderMtgAssign();};
window.delDept=async did=>{if(!confirm('부서를 삭제하시겠습니까?'))return;await _fb.remove(_fb.ref(db,'depts/'+did));toast('삭제되었습니다');await renderDepts();};
window.delMem=async mid=>{if(!confirm('멤버를 삭제하시겠습니까?'))return;await _fb.remove(_fb.ref(db,'members/'+mid));toast('삭제되었습니다');await renderDepts();};
window.openMemModal=async(memId,deptId)=>{
  memEditId=memId;const depts=await getDepts();
  const sel=document.getElementById('mmDept');sel.innerHTML='';
  Object.entries(depts).sort((a,b)=>a[1].order-b[1].order).forEach(([did,d])=>{const o=document.createElement('option');o.value=did;o.textContent=d.name;sel.appendChild(o);});
  sel.value=deptId||'';
  if(memId){const mems=await getMems();const m=mems[memId];document.getElementById('memModalTitle').textContent='👤 멤버 편집';document.getElementById('mmName').value=m.name||'';document.getElementById('mmRole').value=m.role||'교사';document.getElementById('mmDept').value=m.deptId||'';document.getElementById('mmNote').value=m.note||'';}
  else{document.getElementById('memModalTitle').textContent='👤 멤버 추가';document.getElementById('mmName').value='';document.getElementById('mmRole').value='교사';document.getElementById('mmNote').value='';}
  document.getElementById('memModal').classList.add('open');
};
window.closeMemModal=()=>document.getElementById('memModal').classList.remove('open');
window.saveMem=async()=>{
  const name=document.getElementById('mmName').value.trim();const role=document.getElementById('mmRole').value;const deptId=document.getElementById('mmDept').value;const note=document.getElementById('mmNote').value.trim();
  if(!name){toast('성명을 입력하세요','err');return;}
  const mems=await getMems();const mo=Object.values(mems).reduce((m,v)=>Math.max(m,v.order||0),0);
  const data={name,role,deptId,note,order:memEditId?(mems[memEditId]?.order||mo+1):mo+1};
  if(memEditId)await _fb.update(_fb.ref(db,'members/'+memEditId),data);
  else await _fb.push(_fb.ref(db,'members'),data);
  closeMemModal();toast('저장되었습니다 ✓','ok');await renderDepts();
};

function loadSettingsUI(){
  const school=LS.get('school_name')||'';
  document.getElementById('cfgSchool').value=school;
  // QR 링크
  const baseUrl=location.href.replace('인덱스.html','').replace('index.html','');
  const signUrl=baseUrl+'sign.html';
  document.getElementById('signUrl').textContent=signUrl;
  if(db)loadMtgSettings();
}
window.copyUrl=()=>{const url=document.getElementById('signUrl').textContent;navigator.clipboard.writeText(url).then(()=>toast('주소가 복사되었습니다 ✓','ok'));};
async function loadMtgSettings(){
  const mtgs=await getMtgs();const c=document.getElementById('mtgSettingList');
  if(!Object.keys(mtgs).length){c.innerHTML='<p style="font-size:13px;color:var(--tm);">등록된 회의 없음</p>';return;}
  let html='';
  Object.entries(mtgs).sort((a,b)=>(a[1].order||0)-(b[1].order||0)).forEach(([mid,m])=>{
    const sess=m.sessions?Object.entries(m.sessions).sort((a,b)=>b[1].raw.localeCompare(a[1].raw)):[];
    html+=`<div style="margin-bottom:13px;border:1px solid var(--b);border-radius:var(--rs);overflow:hidden;"><div style="background:var(--bg2);padding:9px 12px;display:flex;justify-content:space-between;align-items:center;"><div><div style="font-weight:700;font-size:13px;">${m.name}</div><div style="font-size:11px;color:var(--tm);">${m.type}</div></div><div style="display:flex;gap:5px;"><button class="btn btn-p btn-xs" onclick="openSessModal('${mid}')">+ 날짜 추가</button><button class="btn-del" onclick="delMtg('${mid}')">삭제</button></div></div><div style="padding:7px 12px;">`;
    if(sess.length)sess.forEach(([sk,sv])=>{html+=`<div class="si"><div><div style="font-weight:600;font-size:13px;">📅 ${sv.dateStr}</div><div style="font-size:11px;color:var(--tm);">⏰ ${sv.timeStr||'시간 미지정'}</div></div><button class="btn-del" onclick="delSess('${mid}','${sk}')">삭제</button></div>`;});
    else html+='<p style="font-size:12px;color:var(--tm);padding:3px 0;">날짜 없음</p>';
    html+='</div></div>';
  });
  c.innerHTML=html;
}
window.addMeeting=async()=>{const name=document.getElementById('newMtgName').value.trim();const type=document.getElementById('newMtgType').value;if(!name){toast('회의 이름을 입력하세요','err');return;}const mtgs=await getMtgs();const mo=Object.values(mtgs).reduce((m,v)=>Math.max(m,v.order||0),0);await _fb.push(_fb.ref(db,'meetings'),{name,type,order:mo+1,sessions:{}});document.getElementById('newMtgName').value='';toast('추가되었습니다 ✓','ok');loadMtgSettings();};
window.delMtg=async id=>{if(!confirm('회의를 삭제하시겠습니까?'))return;await _fb.remove(_fb.ref(db,'meetings/'+id));toast('삭제되었습니다');loadMtgSettings();};
window.delSess=async(mid,sk)=>{if(!confirm('이 날짜를 삭제하시겠습니까?'))return;await _fb.remove(_fb.ref(db,`meetings/${mid}/sessions/${sk}`));toast('삭제되었습니다');loadMtgSettings();};
window.saveSchool=async()=>{
  const s=document.getElementById('cfgSchool').value.trim();
  const pin=document.getElementById('cfgPin').value.trim();
  if(pin&&!/^\d{4}$/.test(pin)){toast('PIN은 4자리 숫자','err');return;}
  if(s){LS.set('school_name',s);document.getElementById('hdrTitle').textContent=s+' 전자서명 관리자';document.getElementById('hdrSub').textContent=s;if(db)await _fb.set(_fb.ref(db,'schoolName'),s);}
  if(pin)LS.set('admin_pin',pin);
  toast('저장되었습니다 ✓','ok');
};

window.openSessModal=mid=>{sessMtgId=mid;calDate=null;const now=new Date();calY=now.getFullYear();calM=now.getMonth();renderCal();const sh=document.getElementById('tH');const sm=document.getElementById('tM');sh.innerHTML='';sm.innerHTML='';for(let h=7;h<=22;h++){const o=document.createElement('option');o.value=String(h).padStart(2,'0');o.textContent=String(h).padStart(2,'0')+'시';if(h===14)o.selected=true;sh.appendChild(o);}['00','10','20','30','40','50'].forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m+'분';sm.appendChild(o);});document.getElementById('calSel').textContent='';document.getElementById('sessModal').classList.add('open');};
window.closeSessModal=()=>document.getElementById('sessModal').classList.remove('open');
window.calNav=d=>{calM+=d;if(calM>11){calM=0;calY++;}if(calM<0){calM=11;calY--;}renderCal();};
function renderCal(){
  const mn=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('calMY').textContent=`${calY}년 ${mn[calM]}`;
  const g=document.getElementById('calGrid');g.innerHTML='';
  ['일','월','화','수','목','금','토'].forEach((d,i)=>{const el=document.createElement('div');el.className='cal-dow';if(i===0)el.style.color='#d4736a';el.textContent=d;g.appendChild(el);});
  const fd=new Date(calY,calM,1).getDay();const ld=new Date(calY,calM+1,0).getDate();const td=new Date();
  for(let i=0;i<fd;i++){const el=document.createElement('div');el.className='cal-day empty';g.appendChild(el);}
  for(let d=1;d<=ld;d++){
    const el=document.createElement('div');const dow=new Date(calY,calM,d).getDay();
    let cls='cal-day';if(dow===0)cls+=' sun';
    if(td.getFullYear()===calY&&td.getMonth()===calM&&td.getDate()===d)cls+=' today';
    const ds=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(calDate===ds)cls+=' sel';
    el.className=cls;el.textContent=d;
    el.onclick=()=>{calDate=ds;renderCal();document.getElementById('calSel').textContent=`선택: ${calY}년 ${calM+1}월 ${d}일`;};
    g.appendChild(el);
  }
}
window.confirmSess=async()=>{if(!calDate){toast('날짜를 선택하세요','err');return;}const h=document.getElementById('tH').value;const m=document.getElementById('tM').value;const timeStr=`${h}:${m}`;const d=new Date(calDate);const dateStr=`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;await _fb.push(_fb.ref(db,`meetings/${sessMtgId}/sessions`),{dateStr,timeStr,raw:calDate});closeSessModal();toast('날짜가 추가되었습니다 ✓','ok');loadMtgSettings();};

document.querySelectorAll('.modal').forEach(m=>{m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');});});
init();
</script>
